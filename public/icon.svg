<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Shield Badge -->
  <g filter="url(#shadow)" transform="translate(106, 90)">
    <!-- Shield contour: width 300, height 330 -->
    <path d="M 150 0 
             C 210 25, 270 25, 300 35 
             C 300 160, 270 250, 150 320 
             C 30 250, 0 160, 0 35 
             C 30 25, 90 25, 150 0 Z" 
          fill="url(#shieldGrad)" 
          stroke="#60a5fa" 
          stroke-width="8"/>
          
    <!-- Inner Accent Shield -->
    <path d="M 150 20 
             C 200 40, 250 40, 276 50 
             C 276 155, 250 235, 150 296 
             C 50 235, 24 155, 24 50 
             C 50 40, 100 40, 150 20 Z" 
          fill="#1e40af" 
          opacity="0.5"/>

    <!-- Checkmark -->
    <path d="M 80 155 
             L 130 205 
             L 225 110" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Gold LP Star/Accent -->
    <circle cx="150" cy="70" r="14" fill="url(#goldGrad)"/>
  </g>

  <!-- LP Label at bottom -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">LOSS PREVENTION</text>
</svg>
